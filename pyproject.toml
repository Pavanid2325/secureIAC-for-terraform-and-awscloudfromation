[project]
name = "iac-security-agent"
version = "0.3.0"
description = "RAG-grounded multi-agent CloudFormation security analysis workflow."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.68.0,<3",
  "PyYAML>=6.0.1",
  "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
aws = ["boto3>=1.34.0"]
semantic = ["sentence-transformers>=3,<6"]
scanners = ["checkov>=3,<4", "cfn-lint>=1,<2"]
ui = ["streamlit>=1.40,<2"]
chatgpt = ["keyring>=25,<26", "PyJWT[crypto]>=2.8,<3", "httpx>=0.27,<1", "filelock>=3.16,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
