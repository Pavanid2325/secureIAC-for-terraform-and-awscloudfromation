[project]
name = "iac-security-agent"
version = "0.2.0"
description = "RAG-grounded multi-agent CloudFormation security analysis workflow."
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34.0",
  "botocore>=1.34.0",
  "PyYAML>=6.0.1",
  "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
